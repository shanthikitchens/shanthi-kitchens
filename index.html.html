    // =========================================================================
    // 3. SUPABASE REST SYNC ENGINE
    // =========================================================================
    function hasSupabaseConfig() {
      const url = (state.settings.supabaseUrl || '').trim();
      const key = (state.settings.supabaseAnonKey || '').trim();
      return url.startsWith('https://') && key.length > 10;
    }

    async function sbRequest(path, options = {}) {
      const baseUrl = state.settings.supabaseUrl.trim().replace(/\/+$/, '');
      const key = state.settings.supabaseAnonKey.trim();
      const res = await fetch(`${baseUrl}/rest/v1/${path}`, {
        ...options,
        headers: {
          apikey: key,
          Authorization: `Bearer ${key}`,
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) return null;
      return res.json();
    }

    async function syncSettingsCloud() {
      if (!hasSupabaseConfig()) return;
      state.cloudStatus = 'syncing';
      state.cloudError = '';
      render();
      try {
        await sbRequest('restaurant_settings?on_conflict=id', {
          method: 'POST',
          headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({
            id: 'shanthi-kitchens-main',
            data: state.settings,
            updated_at: new Date().toISOString(),
          }),
        });
        state.cloudStatus = 'synced';
      } catch (err) {
        state.cloudStatus = 'error';
        state.cloudError = err.message || 'Failed to sync settings';
      }
      render();
    }

          sort_order: idx,
          data: item,
          updated_at: new Date().toISOString(),

          method: 'POST',
          headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },

    }

    async function pullFromSupabase(notify = false) {
      if (!hasSupabaseConfig()) {
        state.cloudStatus = 'local';
        if (notify) showToast('Enter your Supabase Project URL first.');
        render();
        return;
      }
      state.cloudStatus = 'syncing';
      state.cloudError = '';
      render();
      try {
        const [settingsRows, menuRows, galleryRows] = await Promise.all([
          sbRequest('restaurant_settings?select=data&id=eq.shanthi-kitchens-main&limit=1'),
          sbRequest('menu_items?select=data&order=sort_order.asc'),
          sbRequest('gallery_images?select=data&order=sort_order.asc'),
        ]);

        if (Array.isArray(settingsRows) && settingsRows[0] && settingsRows[0].data) {
          const remote = settingsRows[0].data;
          state.settings = {
            ...state.settings,
            ...remote,
            supabaseUrl: remote.supabaseUrl || state.settings.supabaseUrl,
            supabaseAnonKey: remote.supabaseAnonKey || state.settings.supabaseAnonKey,
          };
        }
        if (Array.isArray(menuRows) && menuRows.length > 0) {
          state.menuItems = menuRows.map((r) => r.data).filter(Boolean);
        }
        if (Array.isArray(galleryRows) && galleryRows.length > 0) {
          state.galleryImages = galleryRows.map((r) => r.data).filter(Boolean);
        }

        saveLocalState();
        state.cloudStatus = 'synced';
        if (notify) showToast('Synced latest data from Supabase.');
      } catch (err) {
        state.cloudStatus = 'error';
        state.cloudError = err.message || 'Could not read from Supabase';
        if (notify) showToast(`Supabase error: ${state.cloudError}`);
      }
      render();
    }

      await syncSettingsCloud();
      await syncMenuCloud();
      await syncGalleryCloud();
      if (state.cloudStatus !== 'error') {
        showToast('All settings, menu items & gallery photos pushed to Supabase.');
      }
    }

          item.description.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        return catMatch && dietMatch && textMatch;
      });

                    <div>
                      <label class="block text-gold-300 mb-1">Opening Hours</label>
                      <input type="text" data-setting="openingHours" value="${esc(s.openingHours)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/30 text-sm text-cream-50" />
                    </div>
                    <div>
                      <label class="block text-gold-300 mb-1">Owner PIN</label>
                      <input type="text" data-setting="adminPin" value="${esc(s.adminPin)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/30 text-sm text-cream-50" />
                    </div>
                    <div class="sm:col-span-2">
                      <label class="block text-gold-300 mb-1">Delivery &amp; Takeaway Summary</label>
                      <input type="text" data-setting="deliverySummary" value="${esc(s.deliverySummary)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/30 text-sm text-cream-50" />
                    </div>
                    <div class="sm:col-span-2">
                      <label class="block text-gold-300 mb-1">Delivery Areas in Pathanamthitta</label>
                      <input type="text" data-setting="deliveryAreas" value="${esc(s.deliveryAreas)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/30 text-sm text-cream-50" />
                    </div>
                    <div class="sm:col-span-2">
                      <label class="block text-gold-300 mb-1">Minimum Order / Delivery Note</label>
                      <input type="text" data-setting="deliveryMinOrderNote" value="${esc(s.deliveryMinOrderNote)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/30 text-sm text-cream-50" />
                    </div>
                  </div>`
                : ''
            }

            ${
              state.adminTab === 'gallery'
                ? `<div class="space-y-6">
                    <form data-form="add-photo" class="p-5 rounded-2xl bg-forest-950/70 border border-gold-500/30 space-y-3 text-xs">
                      <h3 class="font-serif text-2xl text-gold-300">Add Gallery Photo</h3>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="url" required data-newphoto="url" value="${esc(state.newPhoto.url)}" placeholder="Image URL (https://...) *" class="px-3.5 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30 text-sm text-cream-50" />
                        <input type="text" required data-newphoto="title" value="${esc(state.newPhoto.title)}" placeholder="Photo Title *" class="px-3.5 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30 text-sm text-cream-50" />
                      </div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <select data-newphoto="category" class="px-3.5 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30 text-sm text-cream-50">
                          <option ${state.newPhoto.category === 'Signature Cuisine' ? 'selected' : ''}>Signature Cuisine</option>
                          <option ${state.newPhoto.category === 'Ambiance & Dining' ? 'selected' : ''}>Ambiance & Dining</option>
                          <option ${state.newPhoto.category === 'Spices & Craft' ? 'selected' : ''}>Spices & Craft</option>
                        </select>
                        <input type="text" data-newphoto="caption" value="${esc(state.newPhoto.caption)}" placeholder="Short caption" class="px-3.5 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30 text-sm text-cream-50" />
                      </div>
                      <button type="submit" class="px-5 py-2.5 rounded-full gold-btn text-xs font-bold uppercase tracking-wider">+ Add to Gallery</button>
                    </form>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      ${state.galleryImages
                        .map(
                          (img) => `<div class="p-3 rounded-2xl bg-forest-950/60 border border-gold-500/25 flex items-center gap-3">
                            <img src="${esc(img.url)}" alt="${esc(img.title)}" class="w-20 h-16 rounded-xl object-cover shrink-0 bg-forest-900" />
                            <div class="flex-1 min-w-0">
                              <p class="font-semibold text-sm text-cream-50 truncate">${esc(img.title)}</p>
                              <p class="text-xs text-gold-300">${esc(img.category)}</p>
                            </div>
                            <button data-action="delete-photo" data-id="${esc(img.id)}" class="px-3 py-1.5 rounded-lg bg-red-950/70 border border-red-400/30 text-red-200 text-xs font-semibold">Remove</button>
                          </div>`
                        )
                        .join('')}
                    </div>
                  </div>`
                : ''
            }

            ${
              state.adminTab === 'cloud'
                ? `<div class="space-y-5 text-xs">
                    <div class="p-5 rounded-2xl bg-forest-950/70 border border-gold-500/35 space-y-4">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <h3 class="font-serif text-2xl text-gold-300">Supabase Cloud Connection</h3>
                        ${cloudBadge}
                      </div>
                      <div>
                        <label class="block text-gold-300 mb-1">Supabase Project URL</label>
                        <input type="url" data-setting="supabaseUrl" value="${esc(s.supabaseUrl)}" placeholder="https://your-project-ref.supabase.co" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30 text-sm text-cream-50" />
                      </div>
                      <div>
                        <label class="block text-gold-300 mb-1">Supabase Publishable / Anon Key</label>
                        <input type="text" data-setting="supabaseAnonKey" value="${esc(s.supabaseAnonKey)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30 text-sm text-cream-50" />
                      </div>
                      ${
                        state.cloudError
                          ? `<p class="p-3 rounded-xl bg-red-950/60 border border-red-400/40 text-red-200">${esc(state.cloudError)}</p>`
                          : ''
                      }
                      <div class="flex flex-wrap gap-2.5">
                        <button data-action="push-supabase" class="px-4 py-2.5 rounded-full gold-btn text-xs font-bold uppercase tracking-wider">Push All Data to Supabase</button>
                        <button data-action="pull-supabase" class="px-4 py-2.5 rounded-full bg-forest-800 border border-gold-500/40 text-gold-300 text-xs font-semibold uppercase tracking-wider">Pull Latest from Supabase</button>
                      </div>
                    </div>

                    <div class="p-5 rounded-2xl bg-forest-950/70 border border-gold-500/30 flex flex-wrap gap-3">
                      <button data-action="export-json" class="px-4 py-2.5 rounded-full bg-forest-800 border border-gold-500/40 text-cream-50 text-xs font-semibold uppercase tracking-wider">Export JSON Backup</button>
                      <label class="px-4 py-2.5 rounded-full bg-forest-800 border border-gold-500/40 text-gold-300 text-xs font-semibold uppercase tracking-wider cursor-pointer">
                        Import JSON Backup
                        <input type="file" accept=".json" data-input="import-json" class="hidden" />
                      </label>
                      <button data-action="reset-defaults" class="px-4 py-2.5 rounded-full border border-red-400/40 text-red-300 text-xs font-semibold uppercase tracking-wider">Reset Defaults</button>
                    </div>
                  </div>`
                : ''
            }
          </div>
        </div>
      </div>`;
    }

    // =========================================================================
    // 5. EVENT BINDING
    // =========================================================================
    function bindEvents() {
      document.querySelectorAll('[data-action]').forEach((el) => {
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');
          const id = el.getAttribute('data-id');

          if (action === 'toggle-mobile-nav') {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
          } else if (action === 'close-mobile-nav') {
            state.mobileMenuOpen = false;
            render();
          } else if (action === 'open-admin') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            render();
          } else if (action === 'open-admin-specials') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            state.adminTab = 'specials';
            render();
          } else if (action === 'open-admin-menu') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            state.adminTab = 'menu';
            render();
          } else if (action === 'open-admin-gallery') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            state.adminTab = 'gallery';
            render();
          } else if (action === 'close-admin') {
            state.adminOpen = false;
            render();
          } else if (action === 'set-admin-tab') {
            state.adminTab = el.getAttribute('data-tab');
            render();
          } else if (action === 'set-dietary') {
            state.dietaryFilter = el.getAttribute('data-dietary');
            render();
          } else if (action === 'set-category') {
            state.activeCategory = el.getAttribute('data-category');
            render();
          } else if (action === 'reset-filters') {
            state.activeCategory = 'All';
            state.dietaryFilter = 'All';
            state.searchQuery = '';
            render();
          } else if (action === 'toggle-price-edit') {
            if (!state.adminAllowed) return;
            state.priceEditMode = !state.priceEditMode;
            state.editingPriceId = null;
            render();
          } else if (action === 'start-price') {
            if (!state.adminAllowed) return;
            const item = state.menuItems.find((m) => m.id === id);
            if (item) {
              state.editingPriceId = id;
              state.tempPriceValue = item.price === '[₹ Price]' ? '₹ ' : item.price;
              render();
            }
          } else if (action === 'save-price') {
            const cleaned = (state.tempPriceValue || '').trim() || '[₹ Price]';
            state.menuItems = state.menuItems.map((m) => (m.id === id ? { ...m, price: cleaned } : m));
            state.editingPriceId = null;
            saveLocalState();
            syncMenuCloud();
            showToast('Price updated.');
            render();
          } else if (action === 'cancel-price') {
            state.editingPriceId = null;
            render();
          } else if (action === 'open-lightbox') {
            state.lightboxIndex = Number(el.getAttribute('data-index'));
            render();
          } else if (action === 'close-lightbox') {
            state.lightboxIndex = null;
            render();
          } else if (action === 'prev-lightbox') {
            const len = state.galleryImages.length;
            state.lightboxIndex = (state.lightboxIndex - 1 + len) % len;
            render();
          } else if (action === 'next-lightbox') {
            const len = state.galleryImages.length;
            state.lightboxIndex = (state.lightboxIndex + 1) % len;
            render();
          } else if (action === 'toggle-special') {
            state.menuItems = state.menuItems.map((m) =>
              m.id === id ? { ...m, isTodaysSpecial: !m.isTodaysSpecial } : m
            );
            saveLocalState();
            syncMenuCloud();
            render();
          } else if (action === 'delete-dish') {
            state.menuItems = state.menuItems.filter((m) => m.id !== id);
            saveLocalState();
            deleteMenuCloud(id);
            showToast('Dish removed.');
            render();
          } else if (action === 'delete-photo') {
            state.galleryImages = state.galleryImages.filter((g) => g.id !== id);
            saveLocalState();
            deleteGalleryCloud(id);
            showToast('Photo removed.');
            render();
          } else if (action === 'push-supabase') {
            pushAllToSupabase();
          } else if (action === 'pull-supabase') {
            pullFromSupabase(true);
          } else if (action === 'export-json') {
            const blob = new Blob(
              [
                JSON.stringify(
                  {
                    exportedAt: new Date().toISOString(),
                    settings: state.settings,
                    menuItems: state.menuItems,
                    galleryImages: state.galleryImages,
                  },
                  null,
                  2
                ),
              ],
              { type: 'application/json' }
            );
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'shanthi-kitchens-backup.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Backup JSON downloaded.');
          } else if (action === 'reset-defaults') {
            state.settings = { ...DEFAULT_SETTINGS };
            state.menuItems = DEFAULT_MENU.map((x) => ({ ...x }));
            state.galleryImages = DEFAULT_GALLERY.map((x) => ({ ...x }));
            saveLocalState();
            pushAllToSupabase();
            showToast('Reset to default placeholders.');
            render();
          }
        });
      });

      const searchEl = document.querySelector('[data-input="search-menu"]');
      if (searchEl) {
        searchEl.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          render();
        });
      }

      const tempPriceEl = document.querySelector('[data-input="temp-price"]');
      if (tempPriceEl) {
        tempPriceEl.addEventListener('input', (e) => {
          state.tempPriceValue = e.target.value;
        });
      }

      const pinEl = document.querySelector('[data-input="pin"]');
      if (pinEl) {
        pinEl.addEventListener('input', (e) => {
          state.pinInput = e.target.value;
        });
      }

      document.querySelectorAll('[data-setting]').forEach((el) => {
        const key = el.getAttribute('data-setting');
        el.addEventListener('change', (e) => {
          state.settings[key] = e.target.value;
          if (key === 'phoneDisplay') {
            const digits = e.target.value.replace(/[^\d+]/g, '');
            if (digits) state.settings.phoneHref = digits;
          }
          saveLocalState();
          syncSettingsCloud();
          render();
        });
      });

      document.querySelectorAll('[data-special-badge]').forEach((el) => {
        const id = el.getAttribute('data-special-badge');
        el.addEventListener('change', (e) => {
          state.menuItems = state.menuItems.map((m) =>
            m.id === id ? { ...m, specialBadge: e.target.value || "Today's Special" } : m
          );
          saveLocalState();
          syncMenuCloud();
        });
      });

      document.querySelectorAll('[data-editmenu-id]').forEach((el) => {
        const id = el.getAttribute('data-editmenu-id');
        const field = el.getAttribute('data-editmenu-field');
        el.addEventListener('change', (e) => {
          state.menuItems = state.menuItems.map((m) =>
            m.id === id ? { ...m, [field]: e.target.value } : m
          );
          saveLocalState();
          syncMenuCloud();
          render();
        });
      });

      document.querySelectorAll('[data-newdish]').forEach((el) => {
        const key = el.getAttribute('data-newdish');
        const handler = (e) => {
          state.newDish[key] = el.type === 'checkbox' ? el.checked : e.target.value;
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      document.querySelectorAll('[data-newphoto]').forEach((el) => {
        const key = el.getAttribute('data-newphoto');
        const handler = (e) => {
          state.newPhoto[key] = e.target.value;
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      document.querySelectorAll('[data-res]').forEach((el) => {
        const key = el.getAttribute('data-res');
        const handler = (e) => {
          state.reservation[key] = e.target.value;
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      const importEl = document.querySelector('[data-input="import-json"]');
      if (importEl) {
        importEl.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(String(reader.result));
              if (parsed.settings) state.settings = { ...DEFAULT_SETTINGS, ...parsed.settings };
              if (Array.isArray(parsed.menuItems)) state.menuItems = parsed.menuItems;
              if (Array.isArray(parsed.galleryImages)) state.galleryImages = parsed.galleryImages;
              saveLocalState();
              pushAllToSupabase();
              showToast('Imported JSON backup.');
              render();
            } catch (err) {
              showToast('Invalid JSON file.');
            }
          };
          reader.readAsText(file);
        });
      }

      const unlockForm = document.querySelector('[data-form="unlock-admin"]');
      if (unlockForm) {
        unlockForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if ((state.pinInput || '').trim() === String(state.settings.adminPin || '1234').trim()) {
            state.adminUnlocked = true;
            state.pinError = '';
            showToast('Owner Studio unlocked.');
          } else {
            state.pinError = 'Incorrect PIN. Default is 1234.';
          }
          render();
        });
      }

      const addDishForm = document.querySelector('[data-form="add-dish"]');
      if (addDishForm) {
        addDishForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!state.newDish.name.trim()) return;
          const item = {
            ...state.newDish,
            id: `sk-${Date.now()}`,
            price: (state.newDish.price || '').trim() || '[₹ Price]',
          };
          state.menuItems = [item, ...state.menuItems];
          state.newDish = {
            name: '',
            malayalamName: '',
            category: 'Kerala Heritage',
            description: '',
            price: '₹ ',
            dietary: 'Non-Veg',
            isSignature: false,
            isTodaysSpecial: true,
            specialBadge: "Today's Special",
            spiceLevel: 'Medium',
          };
          saveLocalState();
          syncMenuCloud();
          showToast(`Added "${item.name}".`);
          render();
        });
      }

      const addPhotoForm = document.querySelector('[data-form="add-photo"]');
      if (addPhotoForm) {
        addPhotoForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!state.newPhoto.url.trim() || !state.newPhoto.title.trim()) return;
          const photo = {
            ...state.newPhoto,
            id: `gal-${Date.now()}`,
          };
          state.galleryImages = [photo, ...state.galleryImages];
          state.newPhoto = {
            url: '',
            title: '',
            category: 'Signature Cuisine',
            caption: '',
          };
          saveLocalState();
          syncGalleryCloud();
          showToast('Gallery photo added.');
          render();
        });
      }

      const resForm = document.querySelector('[data-form="reservation"]');
      if (resForm) {
        resForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const r = state.reservation;
          const message = `Hello ${state.settings.name} (${state.settings.locationShort}), I would like to submit a ${r.serviceType}:\n• Name: ${r.guestName}\n• Phone: ${r.phone}\n• Date: ${r.date}\n• Time: ${r.timeSlot}\n• Guests: ${r.guests}\n• Notes: ${r.notes || 'None'}`;
          state.reservationStatus = {
            guestName: r.guestName,
            serviceType: r.serviceType,
            date: r.date,
            guests: r.guests,
            message,
          };
          showToast('Reservation enquiry prepared.');
          render();
        });
      }
    }

    // Initial render & automatic Supabase pull if URL is set
    render();
    if (hasSupabaseConfig()) {
      pullFromSupabase(false);
    }
  </script>
</body>
</html>

          method: 'POST',
          headers: supabaseHeaders('resolution=merge-duplicates,return=minimal'),
          body: JSON.stringify({

            data: state.settings,
            updated_at: new Date().toISOString(),

    async function pullFromSupabase(notify) {
      if (!hasSupabaseConfig()) return;
      state.cloudStatus = 'syncing';
      state.cloudError = '';
      try {
        const [sRes, mRes, gRes] = await Promise.all([
          fetch(`${supabaseTableUrl('restaurant_settings')}?select=data&id=eq.shanthi-kitchens-main&limit=1`, {
            headers: supabaseHeaders(),
          }),
          fetch(`${supabaseTableUrl('menu_items')}?select=data&order=sort_order.asc`, {
            headers: supabaseHeaders(),
          }),
          fetch(`${supabaseTableUrl('gallery_images')}?select=data&order=sort_order.asc`, {
            headers: supabaseHeaders(),
          }),
        ]);
        if (!sRes.ok || !mRes.ok || !gRes.ok) throw new Error('Could not read from Supabase tables.');
        const sRows = await sRes.json();
        const mRows = await mRes.json();
        const gRows = await gRes.json();
        if (Array.isArray(sRows) && sRows[0] && sRows[0].data) {
          state.settings = {
            ...state.settings,
            ...sRows[0].data,
            supabaseUrl: sRows[0].data.supabaseUrl || state.settings.supabaseUrl,
            supabaseAnonKey: sRows[0].data.supabaseAnonKey || state.settings.supabaseAnonKey,
          };
        }
        if (Array.isArray(mRows) && mRows.length > 0) {
          state.menuItems = mRows.map((r) => r.data);
        }
        if (Array.isArray(gRows) && gRows.length > 0) {
          state.galleryImages = gRows.map((r) => r.data);
        }
        saveLocalState();
        state.cloudStatus = 'synced';
        if (notify) showToast('Pulled latest data from Supabase!');
      } catch (err) {
        state.cloudStatus = 'error';
        state.cloudError = err && err.message ? err.message : 'Pull failed';
        if (notify) showToast(state.cloudError);
      }
      render();
    }

    // Compress phone/camera image to lightweight JPEG data URL so it saves reliably
    function compressImageFile(file, maxWidth = 960, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read selected image file.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image format.'));
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              resolve(String(reader.result));
              return;
            }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

        <!-- Gallery Lightbox Modal -->
        ${

                const current = state.galleryImages[state.lightboxIndex];
                return `<div data-lightbox-backdrop="true" class="fixed inset-0 z-[70] bg-forest-950/92 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
                  <div class="max-w-4xl w-full bg-forest-900 border border-gold-500/40 rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl">
                    <div data-lightbox-stage="true" class="relative bg-forest-950 flex items-center justify-center max-h-[64dvh] select-none">

                      <button data-action="prev-lightbox" aria-label="Previous Photo" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-forest-900/90 text-gold-300 border border-gold-500/40 text-xl font-bold">‹</button>
                      <button data-action="next-lightbox" aria-label="Next Photo" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-forest-900/90 text-gold-300 border border-gold-500/40 text-xl font-bold">›</button>

        <!-- Floating Mobile Quick Action Bar -->
        <div class="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-forest-950/95 backdrop-blur-md border-t border-gold-500/30 px-3 py-2 flex items-center gap-2">

            rel="noopener noreferrer"
            class="flex-1 min-h-[42px] inline-flex items-center justify-center rounded-full bg-emerald-800/80 border border-emerald-400/35 text-emerald-100 text-xs font-semibold uppercase tracking-wider"

        ${state.qrModalOpen ? renderQrModal() : ''}

        <!-- Owner Admin Studio Modal -->

      bindEvents();

    function getQrTargetUrl() {
      const fallbackUrl =
        typeof window !== 'undefined' && window.location && window.location.href.startsWith('http')
          ? window.location.href.split('?')[0]
          : 'https://shanthi-kitchens.vercel.app';
      const base = (state.qrUrlInput || fallbackUrl).trim().replace(/\/+$/, '');
      if (!state.qrIncludeAdmin) return base;
      return base.includes('?') ? `${base}&admin=true` : `${base}/?admin=true`;
    }

    function renderQrModal() {
      const targetUrl = getQrTargetUrl();
      const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=12&data=${encodeURIComponent(targetUrl)}`;
      return `<div class="fixed inset-0 z-[75] bg-forest-950/85 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="max-w-md w-full rounded-3xl bg-forest-900 text-cream-50 border border-gold-500/45 p-6 shadow-2xl space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-gold-300">Website QR Code</h2>
            <button data-action="close-qr" class="w-9 h-9 rounded-full border border-gold-500/30 text-cream-100">✕</button>
          </div>
          <p class="text-xs text-cream-100/80 leading-relaxed">
            നിങ്ങളുടെ ലൈവ് വെബ്സൈറ്റ് ലിങ്ക് താഴെ കൊടുത്ത് ടേബിൾ കാർഡുകൾക്കും ബിൽ കൗണ്ടറിനും വേണ്ടി QR Code ഡൗൺലോഡ് ചെയ്യാം.
          </p>
          <div>
            <label class="block text-xs text-gold-300 mb-1">Live Website URL</label>
            <input
              type="url"
              data-input="qr-url"
              value="${esc(state.qrUrlInput)}"
              placeholder="https://your-site.vercel.app"
              class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/35 text-xs sm:text-sm text-cream-50"
            />
          </div>
          <div class="flex gap-2">
            <button
              data-action="qr-mode-customer"
              class="flex-1 py-2 px-3 rounded-xl text-xs font-semibold border ${
                !state.qrIncludeAdmin
                  ? 'bg-gold-500 text-forest-900 border-gold-500'
                  : 'bg-forest-950 text-cream-100 border-gold-500/30'
              }"
            >
              Customer Menu Link
            </button>
            <button
              data-action="qr-mode-admin"
              class="flex-1 py-2 px-3 rounded-xl text-xs font-semibold border ${
                state.qrIncludeAdmin
                  ? 'bg-gold-500 text-forest-900 border-gold-500'
                  : 'bg-forest-950 text-cream-100 border-gold-500/30'
              }"
            >
              Owner Admin (?admin=true)
            </button>
          </div>
          <div class="bg-white p-4 rounded-2xl flex flex-col items-center justify-center">
            <img src="${esc(qrImgSrc)}" alt="QR Code for ${esc(targetUrl)}" class="w-52 h-52 object-contain" />
            <p class="text-[11px] text-forest-900 font-medium mt-2 break-all text-center">${esc(targetUrl)}</p>
          </div>
          <div class="flex gap-2.5">
            <a
              href="${esc(qrImgSrc)}"
              download="shanthi-kitchens-qr.png"
              target="_blank"
              rel="noopener noreferrer"
              class="flex-1 py-2.5 rounded-full gold-btn text-center text-xs font-bold uppercase tracking-wider"
            >
              Download QR Image
            </a>
            <button
              data-action="copy-qr-url"
              class="px-4 py-2.5 rounded-full border border-gold-500/40 text-gold-300 text-xs font-semibold uppercase tracking-wider"
            >
              Copy Link
            </button>
          </div>
        </div>
      </div>`;
    }

    // =========================================================================
    // 5. EVENT BINDING
    // =========================================================================
    function bindMenuCardActions() {
      const container = document.getElementById('menu-cards-container');
      if (!container) return;

      container.querySelectorAll('[data-action]').forEach((el) => {
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');
          const id = el.getAttribute('data-id');
          if (action === 'reset-filters') {
            state.activeCategory = 'All';
            state.dietaryFilter = 'All';
            state.searchQuery = '';
            render();
          } else if (action === 'start-price') {
            if (!state.adminAllowed) return;
            const item = state.menuItems.find((m) => m.id === id);
            if (item) {
              state.editingPriceId = id;
              state.tempPriceValue = item.price === '[₹ Price]' ? '₹ ' : item.price;
              updateMenuCardsOnly();
            }
          } else if (action === 'save-price') {
            const cleaned = (state.tempPriceValue || '').trim() || '[₹ Price]';
            state.menuItems = state.menuItems.map((m) => (m.id === id ? { ...m, price: cleaned } : m));
            state.editingPriceId = null;
            saveLocalState();
            syncMenuCloud();
            showToast('Price updated.');
            updateMenuCardsOnly();
          } else if (action === 'cancel-price') {
            state.editingPriceId = null;
            updateMenuCardsOnly();
          }
        });
      });

      const tempPriceEl = container.querySelector('[data-input="temp-price"]');
      if (tempPriceEl) {
        tempPriceEl.addEventListener('input', (e) => {
          state.tempPriceValue = e.target.value;
        });
      }
    }

    function bindEvents() {
      document.querySelectorAll('[data-action]').forEach((el) => {
        if (el.closest('#menu-cards-container')) return;
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');
          const id = el.getAttribute('data-id');

          if (action === 'toggle-mobile-nav') {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
          } else if (action === 'close-mobile-nav') {
            state.mobileMenuOpen = false;
            render();
          } else if (action === 'open-qr') {
            if (!state.qrUrlInput && typeof window !== 'undefined' && window.location.href.startsWith('http')) {
              state.qrUrlInput = window.location.href.split('?')[0];
            }
            state.qrModalOpen = true;
            render();
          } else if (action === 'close-qr') {
            state.qrModalOpen = false;
            render();
          } else if (action === 'qr-mode-customer') {
            state.qrIncludeAdmin = false;
            render();
          } else if (action === 'qr-mode-admin') {
            state.qrIncludeAdmin = true;
            render();
          } else if (action === 'copy-qr-url') {
            const target = getQrTargetUrl();
            const tmp = document.createElement('textarea');
            tmp.value = target;
            document.body.appendChild(tmp);
            tmp.select();
            try {
              document.execCommand('copy');
              showToast('Link copied!');
            } catch (err) {
              showToast(target);
            }
            document.body.removeChild(tmp);
          } else if (action === 'clear-search') {
            state.searchQuery = '';
            const sInput = document.querySelector('[data-input="search-menu"]');
            if (sInput) {
              sInput.value = '';
              sInput.focus();
            }
            updateMenuCardsOnly();
          } else if (action === 'open-admin') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            render();
          } else if (action === 'open-admin-specials') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            state.adminTab = 'specials';
            render();
          } else if (action === 'open-admin-menu') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            state.adminTab = 'menu';
            render();
          } else if (action === 'open-admin-gallery') {
            if (!state.adminAllowed) return;
            state.adminOpen = true;
            state.adminTab = 'gallery';
            render();
          } else if (action === 'close-admin') {
            state.adminOpen = false;
            render();
          } else if (action === 'set-admin-tab') {
            state.adminTab = el.getAttribute('data-tab');
            render();
          } else if (action === 'set-dietary') {
            state.dietaryFilter = el.getAttribute('data-dietary');
            render();
          } else if (action === 'set-category') {
            state.activeCategory = el.getAttribute('data-category');
            render();
          } else if (action === 'reset-filters') {
            state.activeCategory = 'All';
            state.dietaryFilter = 'All';
            state.searchQuery = '';
            render();
          } else if (action === 'toggle-price-edit') {
            if (!state.adminAllowed) return;
            state.priceEditMode = !state.priceEditMode;
            state.editingPriceId = null;
            render();
          } else if (action === 'start-price') {
            if (!state.adminAllowed) return;
            const item = state.menuItems.find((m) => m.id === id);
            if (item) {
              state.editingPriceId = id;
              state.tempPriceValue = item.price === '[₹ Price]' ? '₹ ' : item.price;
              render();
            }
          } else if (action === 'save-price') {
            const cleaned = (state.tempPriceValue || '').trim() || '[₹ Price]';
            state.menuItems = state.menuItems.map((m) => (m.id === id ? { ...m, price: cleaned } : m));
            state.editingPriceId = null;
            saveLocalState();
            syncMenuCloud();
            showToast('Price updated.');
            render();
          } else if (action === 'cancel-price') {
            state.editingPriceId = null;
            render();
          } else if (action === 'open-lightbox') {
            state.lightboxIndex = Number(el.getAttribute('data-index'));
            render();
          } else if (action === 'close-lightbox') {
            state.lightboxIndex = null;
            render();
          } else if (action === 'prev-lightbox') {
            const len = state.galleryImages.length;
            state.lightboxIndex = (state.lightboxIndex - 1 + len) % len;
            render();
          } else if (action === 'next-lightbox') {
            const len = state.galleryImages.length;
            state.lightboxIndex = (state.lightboxIndex + 1) % len;
            render();
          } else if (action === 'toggle-special') {
            state.menuItems = state.menuItems.map((m) =>
              m.id === id ? { ...m, isTodaysSpecial: !m.isTodaysSpecial } : m
            );
            saveLocalState();
            syncMenuCloud();
            render();
          } else if (action === 'delete-dish') {
            state.menuItems = state.menuItems.filter((m) => m.id !== id);
            saveLocalState();
            deleteMenuCloud(id);
            showToast('Dish removed.');
            render();
          } else if (action === 'delete-photo') {
            state.galleryImages = state.galleryImages.filter((g) => g.id !== id);
            saveLocalState();
            deleteGalleryCloud(id);
            showToast('Photo removed.');
            render();
          } else if (action === 'push-supabase') {
            pushAllToSupabase();
          } else if (action === 'pull-supabase') {
            pullFromSupabase(true);
          } else if (action === 'export-json') {
            const blob = new Blob(
              [
                JSON.stringify(
                  {
                    exportedAt: new Date().toISOString(),
                    settings: state.settings,
                    menuItems: state.menuItems,
                    galleryImages: state.galleryImages,
                  },
                  null,
                  2
                ),
              ],
              { type: 'application/json' }
            );
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'shanthi-kitchens-backup.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Backup JSON downloaded.');
          } else if (action === 'reset-defaults') {
            state.settings = { ...DEFAULT_SETTINGS };
            state.menuItems = DEFAULT_MENU.map((x) => ({ ...x }));
            state.galleryImages = DEFAULT_GALLERY.map((x) => ({ ...x }));
            saveLocalState();
            pushAllToSupabase();
            showToast('Reset to default placeholders.');
            render();
          }
        });
      });

      const searchEl = document.querySelector('[data-input="search-menu"]');
      if (searchEl) {
        searchEl.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          updateMenuCardsOnly();
        });
      }

      const qrUrlEl = document.querySelector('[data-input="qr-url"]');
      if (qrUrlEl) {
        qrUrlEl.addEventListener('input', (e) => {
          state.qrUrlInput = e.target.value;
        });
        qrUrlEl.addEventListener('change', () => {
          render();
        });
      }

      bindMenuCardActions();

      document.querySelectorAll('[data-setting]').forEach((el) => {
        const key = el.getAttribute('data-setting');
        el.addEventListener('change', (e) => {
          state.settings[key] = e.target.value;
          if (key === 'phoneDisplay') {
            const digits = e.target.value.replace(/[^\d+]/g, '');
            if (digits) state.settings.phoneHref = digits;
          }
          saveLocalState();
          syncSettingsCloud();
          render();
        });
      });

      document.querySelectorAll('[data-special-badge]').forEach((el) => {
        const id = el.getAttribute('data-special-badge');
        el.addEventListener('change', (e) => {
          state.menuItems = state.menuItems.map((m) =>
            m.id === id ? { ...m, specialBadge: e.target.value || "Today's Special" } : m
          );
          saveLocalState();
          syncMenuCloud();
        });
      });

      document.querySelectorAll('[data-editmenu-id]').forEach((el) => {
        const id = el.getAttribute('data-editmenu-id');
        const field = el.getAttribute('data-editmenu-field');
        el.addEventListener('change', (e) => {
          state.menuItems = state.menuItems.map((m) =>
            m.id === id ? { ...m, [field]: e.target.value } : m
          );
          saveLocalState();
          syncMenuCloud();
          render();
        });
      });

      document.querySelectorAll('[data-newdish]').forEach((el) => {
        const key = el.getAttribute('data-newdish');
        const handler = (e) => {
          state.newDish[key] = el.type === 'checkbox' ? el.checked : e.target.value;
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      document.querySelectorAll('[data-newphoto]').forEach((el) => {
        const key = el.getAttribute('data-newphoto');
        const handler = (e) => {
          state.newPhoto[key] = e.target.value;
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      document.querySelectorAll('[data-res]').forEach((el) => {
        const key = el.getAttribute('data-res');
        const handler = (e) => {
          state.reservation[key] = e.target.value;
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      const importEl = document.querySelector('[data-input="import-json"]');
      if (importEl) {
        importEl.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(String(reader.result));
              if (parsed.settings) state.settings = { ...DEFAULT_SETTINGS, ...parsed.settings };
              if (Array.isArray(parsed.menuItems)) state.menuItems = parsed.menuItems;
              if (Array.isArray(parsed.galleryImages)) state.galleryImages = parsed.galleryImages;
              saveLocalState();
              pushAllToSupabase();
              showToast('Imported JSON backup.');
              render();
            } catch (err) {
              showToast('Invalid JSON file.');
            }
          };
          reader.readAsText(file);
        });
      }

      const unlockForm = document.querySelector('[data-form="unlock-admin"]');
      if (unlockForm) {
        unlockForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if ((state.pinInput || '').trim() === String(state.settings.adminPin || '1234').trim()) {
            state.adminUnlocked = true;
            state.pinError = '';
            showToast('Owner Studio unlocked.');
          } else {
            state.pinError = 'Incorrect PIN. Default is 1234.';
          }
          render();
        });
      }

      const addDishForm = document.querySelector('[data-form="add-dish"]');
      if (addDishForm) {
        addDishForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!state.newDish.name.trim()) return;
          const item = {
            ...state.newDish,
            id: `sk-${Date.now()}`,
            price: (state.newDish.price || '').trim() || '[₹ Price]',
          };
          state.menuItems = [item, ...state.menuItems];
          state.newDish = {
            name: '',
            malayalamName: '',
            category: 'Kerala Heritage',
            description: '',
            price: '₹ ',
            dietary: 'Non-Veg',
            isSignature: false,
            isTodaysSpecial: true,
            specialBadge: "Today's Special",
            spiceLevel: 'Medium',
          };
          saveLocalState();
          syncMenuCloud();
          showToast(`Added "${item.name}".`);
          render();
        });
      }

      const addPhotoForm = document.querySelector('[data-form="add-photo"]');
      if (addPhotoForm) {
        addPhotoForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const cleanUrl = (state.newPhoto.url || '').trim();
          const cleanTitle = (state.newPhoto.title || '').trim();
          if (!cleanUrl) {
            showToast('ആദ്യം "📷 Choose Photo from Phone / PC" അമർത്തി ഒരു ഫോട്ടോ തിരഞ്ഞെടുക്കുക.');
            return;
          }
          if (!cleanTitle) {
            showToast('ഫോട്ടോയ്ക്ക് ഒരു പേര് (Title) നൽകുക.');
            return;
          }
          const photo = {
            ...state.newPhoto,
            url: cleanUrl,
            title: cleanTitle,
            id: `gal-${Date.now()}`,
          };
          state.galleryImages = [photo, ...state.galleryImages];
          state.newPhoto = {
            url: '',
            title: '',
            category: 'Signature Cuisine',
            caption: '',
          };
          saveLocalState();
          syncGalleryCloud();
          showToast('Gallery photo added!');
          render();
        });
      }

      const photoFileEl = document.querySelector('[data-input="photo-file"]');
      if (photoFileEl) {
        photoFileEl.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          state.photoUploading = true;
          render();
          try {
            const compressedDataUrl = await compressImageFile(file);
            state.newPhoto.url = compressedDataUrl;
            if (!state.newPhoto.title.trim()) {
              state.newPhoto.title = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]+/g, ' ');
            }
            showToast('ഫോട്ടോ ലോഡ് ആയി! ഇനി "+ Add Photo" ക്ലിക്ക് ചെയ്യുക.');
          } catch (err) {
            showToast(err && err.message ? err.message : 'Photo upload failed.');
          } finally {
            state.photoUploading = false;
            render();
          }
        });
      }

      const resForm = document.querySelector('[data-form="reservation"]');
      if (resForm) {
        resForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const r = state.reservation;
          const message = `Hello ${state.settings.name} (${state.settings.locationShort}), I would like to submit a ${r.serviceType}:\n• Name: ${r.guestName}\n• Phone: ${r.phone}\n• Date: ${r.date}\n• Time: ${r.timeSlot}\n• Guests: ${r.guests}\n• Notes: ${r.notes || 'None'}`;
          state.reservationStatus = {
            guestName: r.guestName,
            serviceType: r.serviceType,
            date: r.date,
            guests: r.guests,
            message,
          };
          showToast('Reservation enquiry prepared.');
          render();
        });
      }

      // Touch swipe & backdrop tap support for Gallery Lightbox
      const lbStage = document.querySelector('[data-lightbox-stage="true"]');
      if (lbStage) {
        let touchStartX = 0;
        lbStage.addEventListener(
          'touchstart',
          (e) => {
            if (e.changedTouches && e.changedTouches[0]) {
              touchStartX = e.changedTouches[0].clientX;
            }
          },
          { passive: true }
        );
        lbStage.addEventListener(
          'touchend',
          (e) => {
            if (!e.changedTouches || !e.changedTouches[0]) return;
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const len = state.galleryImages.length;
            if (Math.abs(deltaX) > 40 && len > 1) {
              state.lightboxIndex =
                deltaX < 0
                  ? (state.lightboxIndex + 1) % len
                  : (state.lightboxIndex - 1 + len) % len;
              render();
            }
          },
          { passive: true }
        );
      }

      const lbBackdrop = document.querySelector('[data-lightbox-backdrop="true"]');
      if (lbBackdrop) {
        lbBackdrop.addEventListener('click', (e) => {
          if (e.target === lbBackdrop) {
            state.lightboxIndex = null;
            render();
          }
        });
      }
    }

    // Keyboard navigation for Gallery Lightbox
    window.addEventListener('keydown', (e) => {
      if (state.lightboxIndex === null) return;
      const len = state.galleryImages.length;
      if (e.key === 'Escape') {
        state.lightboxIndex = null;
        render();
      } else if (e.key === 'ArrowRight' && len > 1) {
        state.lightboxIndex = (state.lightboxIndex + 1) % len;
        render();
      } else if (e.key === 'ArrowLeft' && len > 1) {
        state.lightboxIndex = (state.lightboxIndex - 1 + len) % len;
        render();
      }
    });

    // Initial render & automatic Supabase pull if URL is set
    function renderAdminModal() {
      const s = state.settings;
      if (!state.adminUnlocked) {
        return `<div class="fixed inset-0 z-[75] bg-forest-950/85 backdrop-blur-sm flex items-center justify-center p-4">
          <form data-form="unlock-admin" class="max-w-sm w-full rounded-3xl bg-forest-900 text-cream-50 border border-gold-500/45 p-6 shadow-2xl space-y-4">

              <h2 class="font-serif text-2xl font-semibold text-gold-300">Owner Studio</h2>
              <button type="button" data-action="close-admin" class="w-9 h-9 rounded-full border border-gold-500/30 text-cream-100">✕</button>
            </div>
            <p class="text-xs text-cream-100/80">Enter your Owner PIN to edit Today's Specials, Menu, Delivery Details, Gallery &amp; Supabase Cloud.</p>
            <input
              type="password"
              inputmode="numeric"
              value="${esc(state.pinInput)}"
              oninput="state.pinInput = this.value"

            />

            <button type="submit" class="w-full py-3 rounded-full gold-btn text-xs font-bold uppercase tracking-wider">Unlock Studio</button>
          </form>
        </div>`;

      const tabs = [
        { id: 'specials', label: "Today's Specials" },
        { id: 'menu', label: 'Menu & Prices' },
        { id: 'details', label: 'Location & Delivery' },
        { id: 'gallery', label: 'Gallery' },
        { id: 'cloud', label: 'Supabase Cloud' },
      ];

      return `<div class="fixed inset-0 z-[75] bg-forest-950/85 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
        <div class="max-w-4xl w-full max-h-[92dvh] flex flex-col rounded-3xl bg-forest-900 text-cream-50 border border-gold-500/45 shadow-2xl overflow-hidden">
          <div class="px-5 py-4 bg-forest-950 border-b border-gold-500/30 flex items-center justify-between">
            <div>
              <h2 class="font-serif text-2xl font-semibold text-gold-300">Owner Admin Studio</h2>
              <p class="text-[11px] text-cream-100/70">Changes auto-save locally &amp; sync to Supabase when configured</p>
            </div>
            <button data-action="close-admin" class="w-9 h-9 rounded-full border border-gold-500/35 text-cream-100">✕</button>
          </div>

          <div class="px-4 py-2.5 bg-forest-950/70 border-b border-gold-500/20 flex gap-2 overflow-x-auto no-scrollbar">
            ${tabs
              .map(
                (t) => `<button data-action="set-admin-tab" data-tab="${t.id}" class="shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider ${
                  state.adminTab === t.id ? 'bg-gold-500 text-forest-900' : 'bg-forest-900 text-cream-100 border border-gold-500/25'
                }">${esc(t.label)}</button>`
              )
              .join('')}
          </div>

          <div class="p-5 overflow-y-auto space-y-5 flex-1 text-xs sm:text-sm">
            ${
              state.adminTab === 'specials'
                ? `<div class="space-y-4">
                    <div>
                      <label class="block text-xs text-gold-300 mb-1">Today's Specials Banner Note</label>
                      <input type="text" data-setting="todaysSpecialNote" value="${esc(s.todaysSpecialNote)}" class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-gold-500/30 text-cream-50" />
                    </div>
                    <div class="space-y-2.5">
                      ${state.menuItems
                        .map(
                          (item) => `<div class="p-3.5 rounded-2xl bg-forest-950/80 border border-gold-500/25 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                              <p class="font-semibold text-cream-50">${esc(item.name)} <span class="text-gold-300">(${esc(item.price)})</span></p>
                              <input type="text" data-special-badge="${esc(item.id)}" value="${esc(item.specialBadge || "Today's Special")}" placeholder="Badge text" class="mt-1.5 px-2.5 py-1 rounded-lg bg-forest-900 border border-gold-500/25 text-xs text-cream-100" />
                            </div>
                            <button data-action="toggle-special" data-id="${esc(item.id)}" class="px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider ${
                              item.isTodaysSpecial ? 'bg-gold-500 text-forest-900' : 'bg-forest-800 text-cream-100 border border-gold-500/30'
                            }">
                              ${item.isTodaysSpecial ? '★ Featured Today' : '+ Feature Today'}
                            </button>
                          </div>`
                        )
                        .join('')}
                    </div>
                  </div>`
                : ''
            }

            ${
              state.adminTab === 'menu'
                ? `<div class="space-y-5">
                    <form data-form="add-dish" class="p-4 rounded-2xl bg-forest-950 border border-gold-500/30 space-y-3">
                      <p class="font-serif text-xl text-gold-300">Add New Dish</p>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" required data-newdish="name" value="${esc(state.newDish.name)}" placeholder="Dish Name *" class="px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30" />
                        <input type="text" data-newdish="malayalamName" value="${esc(state.newDish.malayalamName)}" placeholder="Malayalam Name (optional)" class="px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30" />
                        <select data-newdish="category" class="px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30">
                          ${CATEGORIES.filter((c) => c !== 'All')
                            .map((c) => `<option ${state.newDish.category === c ? 'selected' : ''}>${esc(c)}</option>`)
                            .join('')}
                        </select>
                        <div class="flex gap-2">
                          <input type="text" data-newdish="price" value="${esc(state.newDish.price)}" placeholder="Price (e.g., ₹ 240)" class="flex-1 px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30" />
                          <select data-newdish="dietary" class="px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30">
                            <option ${state.newDish.dietary === 'Non-Veg' ? 'selected' : ''}>Non-Veg</option>
                            <option ${state.newDish.dietary === 'Veg' ? 'selected' : ''}>Veg</option>
                            <option ${state.newDish.dietary === 'Seafood' ? 'selected' : ''}>Seafood</option>
                          </select>
                        </div>
                      </div>
                      <input type="text" data-newdish="description" value="${esc(state.newDish.description)}" placeholder="Short description of ingredients & style..." class="w-full px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30" />
                      <button type="submit" class="px-5 py-2.5 rounded-full gold-btn text-xs font-bold uppercase tracking-wider">+ Add Dish to Menu</button>
                    </form>

                    <div class="space-y-2.5">
                      ${state.menuItems
                        .map(
                          (item) => `<div class="p-3.5 rounded-2xl bg-forest-950/80 border border-gold-500/25 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div class="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-2">
                              <input type="text" data-editmenu-id="${esc(item.id)}" data-editmenu-field="name" value="${esc(item.name)}" class="px-2.5 py-1.5 rounded-lg bg-forest-900 border border-gold-500/25 text-xs" />
                              <input type="text" data-editmenu-id="${esc(item.id)}" data-editmenu-field="price" value="${esc(item.price)}" class="px-2.5 py-1.5 rounded-lg bg-forest-900 border border-gold-500/25 text-xs text-gold-300 font-semibold" />
                              <input type="text" data-editmenu-id="${esc(item.id)}" data-editmenu-field="description" value="${esc(item.description)}" class="px-2.5 py-1.5 rounded-lg bg-forest-900 border border-gold-500/25 text-xs" />
                            </div>
                            <button data-action="delete-dish" data-id="${esc(item.id)}" class="px-3 py-1.5 rounded-lg border border-red-400/40 text-red-300 text-xs">Delete</button>
                          </div>`
                        )
                        .join('')}
                    </div>
                  </div>`
                : ''
            }

            ${
              state.adminTab === 'details'
                ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div><label class="block text-xs text-gold-300 mb-1">Restaurant Name</label><input type="text" data-setting="name" value="${esc(s.name)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div><label class="block text-xs text-gold-300 mb-1">Tagline</label><input type="text" data-setting="tagline" value="${esc(s.tagline)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div class="sm:col-span-2"><label class="block text-xs text-gold-300 mb-1">Full Address (Pathanamthitta)</label><input type="text" data-setting="fullAddress" value="${esc(s.fullAddress)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div><label class="block text-xs text-gold-300 mb-1">Phone Display</label><input type="text" data-setting="phoneDisplay" value="${esc(s.phoneDisplay)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div><label class="block text-xs text-gold-300 mb-1">WhatsApp Number (with 91)</label><input type="text" data-setting="whatsappNumber" value="${esc(s.whatsappNumber)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div class="sm:col-span-2"><label class="block text-xs text-gold-300 mb-1">Opening Hours</label><input type="text" data-setting="openingHours" value="${esc(s.openingHours)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div class="sm:col-span-2"><label class="block text-xs text-gold-300 mb-1">Delivery Summary</label><input type="text" data-setting="deliverySummary" value="${esc(s.deliverySummary)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div class="sm:col-span-2"><label class="block text-xs text-gold-300 mb-1">Delivery Areas / Wards</label><input type="text" data-setting="deliveryAreas" value="${esc(s.deliveryAreas)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div class="sm:col-span-2"><label class="block text-xs text-gold-300 mb-1">Minimum Order &amp; Packaging Note</label><input type="text" data-setting="deliveryMinOrderNote" value="${esc(s.deliveryMinOrderNote)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                    <div><label class="block text-xs text-gold-300 mb-1">Owner Studio PIN</label><input type="text" data-setting="adminPin" value="${esc(s.adminPin)}" class="w-full px-3 py-2 rounded-xl bg-forest-950 border border-gold-500/30" /></div>
                  </div>`
                : ''
            }

            ${
              state.adminTab === 'gallery'
                ? `<div class="space-y-4">
                    <form data-form="add-photo" class="p-4 rounded-2xl bg-forest-950 border border-gold-500/30 space-y-3">
                      <p class="font-serif text-xl text-gold-300">Add Gallery Photo</p>
                      <div class="flex flex-wrap items-center gap-3">
                        <label class="w-full sm:w-auto text-center px-5 py-3 rounded-xl bg-forest-900 border border-gold-500/50 text-gold-300 text-xs font-semibold cursor-pointer hover:bg-forest-800">
                          ${state.photoUploading ? '⏳ Processing Photo...' : '📷 Choose Photo from Phone / PC'}
                          <input type="file" accept="image/*" data-input="photo-file" class="hidden" />
                        </label>
                      </div>
                      ${
                        state.newPhoto.url
                          ? `<div class="flex items-center gap-3 p-2.5 rounded-xl bg-forest-900/90 border border-gold-500/30">
                              <img src="${esc(state.newPhoto.url)}" alt="Preview" onerror="this.onerror=null;this.src='https://placehold.co/200x150/0B2218/E5C37C?text=Photo';" class="w-16 h-16 rounded-lg object-cover shrink-0" />
                              <div class="text-xs text-cream-100/85">
                                <p class="font-semibold text-gold-300">Photo Selected ✓</p>
                                <p class="text-[11px] text-cream-100/65">താഴെ പേര് നൽകി "+ Add Photo" ബട്ടൺ അമർത്തുക.</p>
                              </div>
                            </div>`
                          : ''
                      }
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" required data-newphoto="title" value="${esc(state.newPhoto.title)}" placeholder="Photo Title (e.g., Special Biryani) *" class="px-3 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30" />
                        <input type="text" data-newphoto="caption" value="${esc(state.newPhoto.caption)}" placeholder="Caption (optional)..." class="px-3 py-2.5 rounded-xl bg-forest-900 border border-gold-500/30" />
                      </div>
                      <button type="submit" class="px-5 py-2.5 rounded-full gold-btn text-xs font-bold uppercase tracking-wider">+ Add Photo</button>
                    </form>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      ${state.galleryImages
                        .map(
                          (img) => `<div class="p-3 rounded-2xl bg-forest-950 border border-gold-500/25 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                              <img src="${esc(img.url)}" alt="${esc(img.title)}" onerror="this.onerror=null;this.src='https://placehold.co/200x150/0B2218/E5C37C?text=Photo';" class="w-14 h-14 rounded-xl object-cover shrink-0" />
                              <p class="font-semibold text-xs truncate">${esc(img.title)}</p>
                            </div>
                            <button data-action="delete-photo" data-id="${esc(img.id)}" class="px-3 py-1.5 rounded-lg border border-red-400/40 text-red-300 text-xs shrink-0">Remove</button>
                          </div>`
                        )
                        .join('')}
                    </div>
                  </div>`
                : ''
            }

            ${
              state.adminTab === 'cloud'
                ? `<div class="space-y-4">
                    <div class="p-4 rounded-2xl bg-forest-950 border border-gold-500/30 space-y-3">
                      <p class="font-serif text-xl text-gold-300">Supabase Long-Term Cloud Sync</p>
                      <p class="text-xs text-cream-100/80">Your publishable key is already pre-filled. Paste your Supabase Project URL below and click Push All Data to Supabase.</p>
                      <div>
                        <label class="block text-xs text-gold-300 mb-1">Supabase Project URL</label>
                        <input type="url" data-setting="supabaseUrl" value="${esc(s.supabaseUrl)}" placeholder="https://xxxxxxxxxxxx.supabase.co" class="w-full px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30" />
                      </div>
                      <div>
                        <label class="block text-xs text-gold-300 mb-1">Supabase Publishable Key</label>
                        <input type="text" data-setting="supabaseAnonKey" value="${esc(s.supabaseAnonKey)}" class="w-full px-3 py-2 rounded-xl bg-forest-900 border border-gold-500/30" />
                      </div>
                      ${state.cloudError ? `<p class="text-xs text-red-300">${esc(state.cloudError)}</p>` : ''}
                      <div class="flex flex-wrap gap-2 pt-1">
                        <button data-action="push-supabase" class="px-4 py-2.5 rounded-full gold-btn text-xs font-bold uppercase tracking-wider">Push All Data to Supabase</button>
                        <button data-action="pull-supabase" class="px-4 py-2.5 rounded-full border border-gold-500/40 text-gold-300 text-xs font-semibold uppercase tracking-wider">Pull from Supabase</button>
                      </div>
                    </div>

                    <div class="p-4 rounded-2xl bg-forest-950 border border-gold-500/25 flex flex-wrap gap-2.5">
                      <button data-action="export-json" class="px-4 py-2 rounded-full border border-gold-500/40 text-gold-300 text-xs font-semibold uppercase tracking-wider">Export JSON Backup</button>
                      <label class="px-4 py-2 rounded-full border border-gold-500/40 text-cream-100 text-xs font-semibold uppercase tracking-wider cursor-pointer">
                        Import JSON Backup
                        <input type="file" accept=".json" data-input="import-json" class="hidden" />
                      </label>
                      <button data-action="reset-defaults" class="px-4 py-2 rounded-full border border-red-400/40 text-red-300 text-xs font-semibold uppercase tracking-wider">Reset Defaults</button>
                    </div>
                  </div>`
                : ''
            }
          </div>
        </div>
      </div>`;
    }

    render();
    if (hasSupabaseConfig()) {
      pullFromSupabase(false);
    }
  </script>
</body>
</html>
